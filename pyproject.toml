[project]
name = "antares-dotenv"
version = "1.2.0"
description = "A minimal utility to load environment variables with automatic type casting."
authors = [{ name = "Antares Mugisho", email = "antaresmugisho@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
